name: Jazz Recovery Android Build
on:
  push:
    branches: [feature/android-neon-ui-20261021, feature/passkey-reset-ui-20261021]
  pull_request:
    branches: [feature/recovery-pin-20261021]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jazz-recovery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
