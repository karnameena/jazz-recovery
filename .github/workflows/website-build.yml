name: Jazz Recovery Website Build
on:
  pull_request:
    branches: [feature/neon-web-compat-20261012]
  push:
    branches: [feature/hosted-registration-pin-passkey-ui-20261023]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        run: npm run build
