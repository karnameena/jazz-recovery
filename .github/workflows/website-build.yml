name: Jazz Recovery Website Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/website-neon-audit-20261024, feature/single-current-photo-ui-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
