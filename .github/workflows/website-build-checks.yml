name: Website build checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/subscriptions-fresh-start-20261022]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
